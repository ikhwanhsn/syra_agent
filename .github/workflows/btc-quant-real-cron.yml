# BTC quant real lab ticks (cbBTC Earn lane). No-ops until lab config enabled
# and BTC_QUANT_REAL_CRON_ENABLED=true on the API (in-process) or this GHA runs.
#
# Repository secrets:
#   SYRA_API_BASE_URL — e.g. https://api.syraa.fun
#   SYRA_API_KEY — gateway API key (X-API-Key)
#   BTC_QUANT_EXPERIMENT_CRON_SECRET — optional; must match API when set
name: BTC quant real cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  btc-quant-real-ticks:
    runs-on: ubuntu-latest
    steps:
      - name: POST signal-tick + resolve-tick (btc1)
        env:
          BASE_URL: ${{ secrets.SYRA_API_BASE_URL }}
          API_KEY: ${{ secrets.SYRA_API_KEY }}
          CRON_SECRET: ${{ secrets.BTC_QUANT_EXPERIMENT_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "::warning::Set SYRA_API_BASE_URL in repo secrets to enable BTC quant real cron."
            exit 0
          fi
          if [ -z "${API_KEY:-}" ]; then
            echo "::warning::Set SYRA_API_KEY in repo secrets (API gateway requires X-API-Key)."
            exit 0
          fi
          ORIGIN="${BASE_URL%/}"
          HDR=(-H "X-API-Key: ${API_KEY}" -H "Accept: application/json")
          if [ -n "${CRON_SECRET:-}" ]; then
            HDR+=(-H "x-btc-quant-secret: ${CRON_SECRET}")
          fi
          for PATH_SUFFIX in "signal-tick?lane=btc1" "resolve-tick?lane=btc1"; do
            URL="${ORIGIN}/experiment/btc-quant-real/${PATH_SUFFIX}"
            echo "POST ${URL}"
            HTTP_CODE=$(curl -sS -o /tmp/btc-real.json -w "%{http_code}" -X POST "${URL}" \
              "${HDR[@]}")
            echo "HTTP ${HTTP_CODE}"
            cat /tmp/btc-real.json
            echo
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::BTC quant real ${PATH_SUFFIX} returned HTTP ${HTTP_CODE}"
              exit 1
            fi
            node -e "const r=require('/tmp/btc-real.json'); if(r.success!==true){console.error(r);process.exit(1)}"
            node -e "const r=require('/tmp/btc-real.json'); const d=r.data||{}; console.log(JSON.stringify({skipped:d.skipped,reason:d.reason,opened:d.opened,errors:(d.errors||[]).slice(0,3)},null,2))"
          done
