# LST Loop real lab ticks. Gated in API by LST_LOOP_CRON.realEnabled.
# Public Earn still requires adapter readiness + publicEarnListed.
#
# Repository secrets:
#   SYRA_API_BASE_URL — e.g. https://api.syraa.fun
#   SYRA_API_KEY — gateway API key (X-API-Key)
#   EARN_EXPERIMENT_CRON_SECRET — optional; header x-earn-experiment-secret
name: LST loop real cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  lst-loop-real-ticks:
    runs-on: ubuntu-latest
    steps:
      - name: POST cron/signal + cron/resolve
        env:
          BASE_URL: ${{ secrets.SYRA_API_BASE_URL }}
          API_KEY: ${{ secrets.SYRA_API_KEY }}
          CRON_SECRET: ${{ secrets.EARN_EXPERIMENT_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "::warning::Set SYRA_API_BASE_URL in repo secrets to enable LST loop real cron."
            exit 0
          fi
          if [ -z "${API_KEY:-}" ]; then
            echo "::warning::Set SYRA_API_KEY in repo secrets (API gateway requires X-API-Key)."
            exit 0
          fi
          ORIGIN="${BASE_URL%/}"
          HDR=(-H "X-API-Key: ${API_KEY}" -H "Accept: application/json")
          if [ -n "${CRON_SECRET:-}" ]; then
            HDR+=(-H "x-earn-experiment-secret: ${CRON_SECRET}")
          fi
          for PATH_SUFFIX in cron/signal cron/resolve; do
            URL="${ORIGIN}/experiment/lst-loop-real/${PATH_SUFFIX}"
            echo "POST ${URL}"
            HTTP_CODE=$(curl -sS -o /tmp/lst-real.json -w "%{http_code}" -X POST "${URL}" \
              "${HDR[@]}")
            echo "HTTP ${HTTP_CODE}"
            cat /tmp/lst-real.json
            echo
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::LST loop real ${PATH_SUFFIX} returned HTTP ${HTTP_CODE}"
              exit 1
            fi
            node -e "const r=require('/tmp/lst-real.json'); if(r.success!==true){console.error(r);process.exit(1)}"
            node -e "const r=require('/tmp/lst-real.json'); const d=r.data||{}; console.log(JSON.stringify({skipped:d.skipped,reason:d.reason,opened:d.opened,errors:(d.errors||[]).slice(0,3)},null,2))"
          done
